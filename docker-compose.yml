# Amazon deals (from mydealz.de): https://deals.halle.biz on VPS 2 (oracle-a1), outside Coolify.
# Deploy: ./deploy.sh  ·  Secrets in ~/amz-deals/.env on the VPS (BASIC_AUTH_USERS, INGEST_TOKEN, ...)
services:
  web:
    build: .
    image: amz-deals:latest
    container_name: amz-deals
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_USE_ENV_PROXY: "1"
      HTTP_PROXY: ${WARP_PROXY:-http://warp:1080}
      HTTPS_PROXY: ${WARP_PROXY:-http://warp:1080}
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - amz-deals-data:/app/data
    networks: [coolify]
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.middlewares.amzdeals-redir.redirectscheme.scheme: https
      traefik.http.middlewares.amzdeals-auth.basicauth.users: ${BASIC_AUTH_USERS}
      traefik.http.routers.amzdeals-http.entrypoints: http
      traefik.http.routers.amzdeals-http.rule: Host(`deals.halle.biz`)
      traefik.http.routers.amzdeals-http.middlewares: amzdeals-redir
      traefik.http.routers.amzdeals.entrypoints: https
      traefik.http.routers.amzdeals.rule: Host(`deals.halle.biz`)
      traefik.http.routers.amzdeals.tls: "true"
      traefik.http.routers.amzdeals.tls.certresolver: letsencrypt
      traefik.http.routers.amzdeals.middlewares: amzdeals-auth
      traefik.http.services.amzdeals.loadbalancer.server.port: "3000"

volumes:
  amz-deals-data:

networks:
  coolify:
    external: true
